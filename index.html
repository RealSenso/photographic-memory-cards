<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plates · Photographic Memory Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="cards_data.js?v=20261028_cmo19"></script>
  <script src="cards_dip.js?v=20261028_dip"></script>
  <script src="cards_laa.js?v=20261028_laa"></script>
  <script src="cards_stoma.js?v=20261028_stoma"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg: #0b0f1a; --rail: #0f1424; --panel: #0f1527; --panel-2: #121930; --deep: #0c1122;
      --line: #1d2640; --line-2: #25314f; --line-3: #2a3a5e;
      --text: #e6ebf5; --text-2: #d3dbec; --muted: #9aa6c0; --muted-2: #b4bfd6;
      --accent: #5cc8f5; --green: #5fd3a0; --amber: #f2b84b; --red: #f5c2c2;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mono { font-family: var(--mono); }

    .app { display: flex; min-height: 100vh; }

    /* ---------- left rail ---------- */
    .rail { flex: 0 0 272px; width: 272px; background: var(--rail); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
    .logo { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 18px; color: var(--accent); }
    .brand-name { font-family: var(--serif); font-size: 22px; }
    .label { font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px; color: #8e9bb8; padding: 0 8px 6px; }
    .subj { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted-2); font-size: 14px; text-align: left; }
    .subj:hover { background: #121930; }
    .subj.active { background: #151c33; border-color: var(--line-2); color: var(--text); font-weight: 600; }
    .subj .dot { width: 8px; height: 8px; border-radius: 50%; }
    .subj .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #8e9bb8; }
    .topic { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--muted-2); font-size: 13.5px; text-align: left; }
    .topic:hover { background: #121930; }
    .topic.active { background: #151c33; color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
    .topic .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topic .cnt { font-family: var(--mono); font-size: 11px; color: #8e9bb8; }
    .ring { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #3a476a; flex-shrink: 0; }
    .topic.active .ring { border: 2px solid var(--accent); }
    .progress { margin-top: auto; border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; background: #121930; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; color: var(--muted-2); }
    .bar { height: 6px; border-radius: 3px; background: #1f2a47; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); }

    /* ---------- main column ---------- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: rgba(13,18,32,0.94); backdrop-filter: blur(8px); }
    .crumb { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #8e9bb8; min-width: 0; flex: 1 1 200px; }
    .crumb b { color: var(--text); font-weight: 500; }
    .crumb span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search { position: relative; flex: 1 1 260px; max-width: 440px; }
    .search input { width: 100%; min-height: 44px; padding: 0 56px 0 40px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 14px; }
    .search input::placeholder { color: #8e9bb8; }
    .search svg { position: absolute; left: 14px; top: 14px; }
    .search kbd { position: absolute; right: 12px; top: 11px; font-family: var(--mono); font-size: 11px; border: 1px solid #2f3c60; border-radius: 6px; padding: 2px 6px; color: var(--muted-2); }
    .results { position: absolute; top: 50px; left: 0; right: 0; background: #101730; border: 1px solid var(--line-3); border-radius: 12px; padding: 6px; box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8); max-height: 60vh; overflow-y: auto; }
    .results[hidden] { display: none; }
    .res { width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 3px; min-height: 44px; }
    .res:hover, .res:focus-visible { background: #17203d; }
    .res .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .res .snip { font-size: 12.5px; color: var(--muted-2); }
    .res-empty { padding: 14px; font-size: 13px; color: var(--muted); }
    .modes { display: flex; padding: 4px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); }
    .modes button { min-height: 36px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; color: var(--muted-2); font-size: 13.5px; }
    .modes button[aria-selected="true"] { background: var(--accent); color: #06101c; font-weight: 600; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; }
    .btn:hover { background: #17203d; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #06101c; font-weight: 600; }
    .menu-btn { display: none; width: 44px; padding: 0; justify-content: center; }

    .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 32px 0; }
    .chipbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted-2); font-family: var(--mono); font-size: 13px; }
    .chipbtn.r3 { border-color: #2c6e57; background: #11261f; color: var(--green); }
    .chipbtn.r2 { border-color: #5a4620; background: #1d1809; color: var(--amber); }
    .chipbtn.r1 { border-color: #6b3a3a; background: #231316; color: var(--red); }
    .chipbtn.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--text); }
    .hint { margin-left: auto; font-size: 13px; color: #8e9bb8; }
    .hint kbd { font-family: var(--mono); color: var(--muted-2); }

    .stage { flex: 1; padding: 20px 32px 12px; }

    /* ---------- the 16:9 card ---------- */
    .card { display: flex; flex-wrap: wrap; aspect-ratio: 16 / 9; width: 100%; max-width: 1500px; margin: 0 auto; border: 1px solid var(--line-2); border-radius: 20px; background: var(--panel); overflow: clip; }
    .card-left { flex: 1 1 520px; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px; }
    .card-right { flex: 0 1 38%; min-width: 280px; border-left: 1px solid var(--line-2); background: var(--deep); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .chip { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); }
    .cat { font-family: var(--mono); font-size: 11px; letter-spacing: 1.3px; color: var(--muted); text-transform: uppercase; }
    .card-title { margin: 6px 0 0; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 2.6vw, 38px); line-height: 1.1; letter-spacing: -0.2px; }
    .sec-label { font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 6px; }
    .sec-label.muted { color: var(--muted); margin: 0; }
    .mech { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: clamp(13.5px, 1.05vw, 16px); line-height: 1.5; color: var(--text-2); }
    .mech li { display: flex; gap: 10px; align-items: baseline; }
    .mech .lead { flex: 0 0 38px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
    .mech strong { color: #fff; }
    .math-block { border-radius: 12px; border: 1px solid var(--line-3); background: #121c36; padding: 10px 16px; color: #f2f5fb; overflow-x: auto; text-align: center; }
    .math-block .katex-display { margin: 0.3em 0; }
    .math-block .katex { font-size: 1.12em; }
    .duo { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; }
    .anchor, .trap { flex: 1 1 220px; border-radius: 12px; padding: 11px 14px; font-size: clamp(13px, 1vw, 15px); line-height: 1.45; }
    .anchor { border: 1px solid #1f5a47; background: #0d1d19; color: var(--text-2); }
    .anchor .sec-label { color: var(--green); }
    .anchor p { margin: 0; font-style: italic; }
    .trap { border: 1px solid #5a4620; background: #1d1809; color: #f6e6c0; }
    .trap .sec-label { color: var(--amber); }
    .trap p { margin: 0; }
    .plate-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .copy-btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
    .copy-btn:hover { background: #17203d; }
    .copy-btn.bg-emerald-500 { background: #34d399 !important; color: #06101c !important; border-color: #34d399 !important; }
    figure.plate-fig { margin: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .plate { flex: 1; background: #fff; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
    .plate-img { max-width: 100%; max-height: 440px; object-fit: contain; cursor: zoom-in; }
    .plate-svg { width: 100%; }
    .plate-svg svg { width: 100%; height: auto; display: block; }
    figcaption { font-size: 13.5px; line-height: 1.45; color: var(--muted-2); }
    .expand { margin-left: 8px; border: 0; background: none; color: var(--accent); font-size: 12.5px; text-decoration: underline; min-height: 32px; }

    /* ---------- recall ---------- */
    .recall { display: flex; flex-wrap: wrap; gap: 32px; max-width: 1280px; margin: 0 auto; }
    .recall > section { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .recall h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.12; }
    .recall .plate { padding: 20px; }
    .slot { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; border: 1px dashed #34426a; background: var(--panel); }
    .slot.trap-slot { border-color: #5a4620; background: #17130a; }
    .slot .k { font-family: var(--mono); font-size: 12px; color: #8e9bb8; width: 20px; }
    .slot .ln { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .slot .ln i { display: block; height: 9px; border-radius: 5px; background: #1f2a47; }
    .slot .nm { font-size: 13px; color: var(--muted); }
    .reveal { min-height: 56px; margin-top: 6px; border-radius: 14px; border: 0; background: var(--accent); color: #06101c; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .reveal kbd { font-family: var(--mono); font-size: 12px; border: 1px solid rgba(6,16,28,0.4); border-radius: 6px; padding: 2px 8px; }

    /* ---------- traps list ---------- */
    .traps { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .traps h1 { margin: 0 0 6px; font-family: var(--serif); font-weight: 400; font-size: 34px; }
    .trap-row { text-align: left; width: 100%; display: flex; gap: 16px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; border: 1px solid #5a4620; background: #1d1809; color: #f6e6c0; }
    .trap-row:hover { background: #251e0b; }
    .trap-row .n { font-family: var(--mono); font-size: 12px; color: var(--amber); padding-top: 3px; }
    .trap-row .tt { font-family: var(--serif); font-size: 21px; color: #fff; margin-bottom: 4px; }
    .trap-row .tx { font-size: 14.5px; line-height: 1.5; }

    .empty { max-width: 560px; margin: 80px auto; text-align: center; color: var(--muted-2); line-height: 1.6; }
    .empty h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; color: var(--text); margin: 0 0 8px; }

    /* ---------- action bar ---------- */
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 32px 24px; }
    .actions .sp { flex: 1 1 0; min-width: 8px; }
    .actions .q { font-size: 13px; color: #8e9bb8; }
    .rate { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 14.5px; }
    .rate kbd { font-family: var(--mono); font-size: 11px; opacity: .8; margin-left: 6px; }
    .rate.again { border-color: #6b3a3a; background: #231316; color: var(--red); }
    .rate.good { border-color: #2c6e57; background: #11261f; color: #a9ecd0; }
    .rate:disabled { opacity: .4; cursor: not-allowed; }
    .nav { min-height: 48px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); font-size: 14.5px; }
    .nav.next { background: var(--accent); border-color: var(--accent); color: #06101c; font-weight: 600; }

    .scrim { display: none; }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
      .menu-btn { display: inline-flex; }
      .rail { position: fixed; z-index: 60; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s ease; }
      .rail.open { transform: none; }
      .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; }
      .topbar, .strip, .stage, .actions { padding-left: 16px; padding-right: 16px; }
      .card { aspect-ratio: auto; }
      .card-right { flex-basis: 100%; border-left: 0; border-top: 1px solid var(--line-2); }
      .hint { display: none; }
      .search kbd { display: none; }
    }

    /* ---------- print: whole topic, one card per page ---------- */
    @media print {
      html, body { background: #fff !important; color: #000 !important; }
      .rail, .topbar, .strip, .actions, .scrim, #toast { display: none !important; }
      .stage { padding: 0 !important; }
      .card { break-inside: avoid; page-break-after: always; aspect-ratio: auto; margin: 0 0 12px; background: #fff; border: 1px solid #999; color: #000; }
      .card-left, .card-right { background: #fff !important; }
      .card * { color: #000 !important; background-color: transparent !important; border-color: #999 !important; }
      .plate { background: #fff !important; border: 1px solid #ccc; }
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-black">
<div class="scrim" id="scrim" onclick="toggleRail(false)"></div>

<div class="app">
  <aside class="rail" id="rail" aria-label="Subjects and topics">
    <div class="brand"><div class="logo" aria-hidden="true">P</div><div class="brand-name">Plates</div></div>
    <div>
      <div class="label">SUBJECTS</div>
      <div id="subject-list"></div>
    </div>
    <div>
      <div class="label" id="topics-label">TOPICS</div>
      <div id="topic-list"></div>
    </div>
    <div class="progress" id="progress-card"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn menu-btn" onclick="toggleRail(true)" aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#b4bfd6" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8e9bb8" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="search-input" type="text" autocomplete="off" placeholder="Search formulas, traps, topics" aria-label="Search all cards" oninput="runSearch()" onfocus="runSearch()">
        <kbd>⌘K</kbd>
        <div class="results" id="search-results" hidden></div>
      </div>
      <div class="modes" role="tablist" aria-label="Study mode">
        <button role="tab" id="mode-study" aria-selected="true" onclick="setMode('study')">Study</button>
        <button role="tab" id="mode-recall" aria-selected="false" onclick="setMode('recall')">Recall</button>
        <button role="tab" id="mode-traps" aria-selected="false" onclick="setMode('traps')">Traps</button>
      </div>
      <button class="btn" onclick="printDeck()" aria-label="Print this topic">Print</button>
      <button class="btn primary" onclick="openAddModal()">+ Add card</button>
    </header>

    <div class="strip" id="card-strip"></div>
    <main class="stage" id="stage"></main>
    <footer class="actions" id="actions"></footer>
  </div>
</div>

    <!-- ================= LIGHTBOX IMAGE MODAL ================= -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/92 backdrop-blur-md z-50 p-4 flex items-center justify-center hidden" onclick="closeLightbox()">
      <div class="max-w-5xl max-h-[92vh] w-full bg-[#0c101d] border border-cyan-500/40 rounded-2xl p-6 shadow-2xl flex flex-col items-center relative" onclick="event.stopPropagation()">
        <div class="w-full flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div>
            <h4 id="lightbox-title" class="text-base sm:text-lg font-bold text-white font-serif-title"></h4>
            <p id="lightbox-ref" class="text-xs font-mono text-cyan-400"></p>
          </div>
          <button onclick="closeLightbox()" class="text-slate-300 hover:text-white px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm">✕ Close</button>
        </div>
        <div class="flex-1 w-full flex items-center justify-center overflow-auto p-4 bg-white rounded-xl shadow-inner">
          <img id="lightbox-img" src="" alt="Enlarged Specimen" class="max-h-[74vh] max-w-full object-contain">
        </div>
        <div class="mt-3 text-xs text-slate-400 font-mono text-center">
          Click outside or press ✕ to return to orbital desk
        </div>
      </div>
    </div>

    <!-- ================= ADD NEW CARD MODAL ================= -->
    <div id="add-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 p-4 flex items-center justify-center hidden">
      <div class="w-full max-w-xl bg-[#0c101d] border border-cyan-500/30 rounded-2xl p-6 shadow-2xl text-slate-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <span>✨</span> Create a 16:9 Cosmic Knowledge Card
          </h3>
          <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>

        <form onsubmit="saveCustomCard(event)" class="space-y-3.5 text-xs">
          <div>
            <label class="block font-medium text-slate-300 mb-1">1. Concept Title (Top Banner)</label>
            <input type="text" id="new-title" required placeholder="e.g. Linear Independence Constraint Qualification (LICQ)" class="w-full bg-[#12182b] border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-400">
          </div>

          <div>
            <label class="block font-medium text-slate-300 mb-1">2. Core Plain Translation (The Feynman Mechanism)</label>
            <textarea id="new-info" required rows="2" placeholder="Explain the concept in crisp, intuitive plain words..." class="w-full bg-[#12182b] border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-400"></textarea>
          </div>

          <div>
            <label class="block font-medium text-slate-300 mb-1">3. Formal Mathematics (LaTeX equations)</label>
            <input type="text" id="new-math" placeholder="e.g. $\nabla h_i(x^*)$ and $\nabla g_j(x^*)$ are linearly independent" class="w-full bg-[#12182b] border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-400 font-mono">
          </div>

          <div>
            <label class="block font-medium text-slate-300 mb-1">4. Personal Memory Anchor / Analogy</label>

<script>

    const defaultDeck = [
      {

      {

        title: "The Tangent Vector d & Tangent Plane",
        category: "LIMIT DEFINITIONS",
        textbookImg: "assets/luenberger_fig11_2a.png",
        textbookRef: "Luenberger & Ye (4th ed), Sect. 11.2, Fig. 11.2a (p. 324)",
        drawingCaption: "Luenberger Fig. 11.2a: Tangent plane M to surface S at x* with normal ∇h(x*)ᵀ",
        coreTranslation: [
          "<strong>Luenberger's Curve Definition (p. 323):</strong> A curve on surface $S$ is parameterized as $x(t) \\in S$. The derivative at $x^*$ is velocity $\\dot{x}(t^*)$. The tangent plane is the collection of all such derivatives!",

        math: `$$\\dot{x}(t^*) = \\lim_{t \\to t^*} \\frac{x(t) - x^*}{t - t^*}, \\quad M = \\{y : \\nabla h(x^*)^T y = 0\\}$$ $$\\lim_{k \\to \\infty} \\frac{x_k - x}{t_k} = d, \\quad x_k \\in \\Omega, \\; t_k \\downarrow 0$$`,

        drawingSvg: `
          <svg viewBox="0 0 240 145" class="w-full h-full">

          "<strong>Why a cone?</strong> If $d \\in T_\\Omega(x)$, then re-scaling time $t_k \\to t_k / \\alpha$ proves $\\alpha d \\in T_\\Omega(x)$ for all $\\alpha \\ge 0$.",

        ],
        math: `$$T_\\Omega(x) = \\{ d \\in \\mathbb{R}^n : d \\text{ is tangent to } \\Omega \\text{ at } x \\}$$ $$d \\in T_\\Omega(x) \\implies \\alpha d \\in T_\\Omega(x), \\quad \\forall \\alpha \\ge 0$$`,
        personalConnection: "A flashlight beam shining out from point $x$ into the courtyard: you can walk as fast as you want along that ray ($\alpha d$), but turning 180° backward into the solid wall is blocked.",

      {

        drawingSvg: `
          <svg viewBox="0 0 240 145" class="w-full h-full">

            <text x="215" y="128" fill="#000000" font-size="9" font-family="serif" font-style="italic">x₁</text>
            <text x="42" y="25" fill="#000000" font-size="9" font-family="serif" font-style="italic">x₂</text>
            <!-- Shaded First Quadrant -->
            <rect x="55" y="25" width="145" height="90" fill="#f1f5f9" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>
            <!-- Origin -->
            <circle cx="55" cy="115" r="4" fill="#000000"/>
            <text x="40" y="128" fill="#000000" font-size="9" font-family="serif" font-style="italic">(0,0)</text>
            <text x="125" y="65" fill="#000000" font-size="10" font-family="serif" font-style="italic" font-weight="bold">T_Ω(0,0) = ℝ²₊</text>
            <text x="125" y="82" fill="#000000" font-size="8.5" font-family="monospace">[0, ∞) × [0, ∞)</text>
          </svg>
        `,
        drawingCaption: "At a 90° corner, the cone is the entire first quadrant",
        coreTranslation: [
          "Let $\\Omega = \\{(x_1, x_2) : x_1 \\ge 0, x_2 \\ge 0\\}$. At the origin $(0,0)$, both constraints are active.",
          "For candidate direction $d = (d_1, d_2)$, $x_k = (x_{k,1}, x_{k,2}) \\in \\Omega$ implies $(x_{k,1}/t_k, x_{k,2}/t_k) \\to (d_1, d_2)$.",
          "Since $x_{k,i} \\ge 0$ and $t_k > 0$, taking limits forces $d_1 \\ge 0, d_2 \\ge 0$. Conversely, $x_k = t_k d$ is feasible. Thus $T_\\Omega((0,0)) = \\mathbb{R}_+^2$."
        ],
        math: `$$x_k = (t_k d_1, t_k d_2) \\in \\Omega \\iff d_1 \\ge 0, \\, d_2 \\ge 0$$ $$T_\\Omega((0,0)) = [0, \\infty) \\times [0, \\infty)$$`,
        personalConnection: "Standing right at the corner flag of a soccer field: every legal kick inside the pitch must have both non-negative forward and non-negative lateral components.",
        examTrap: "Common blunder: guessing $T_\\Omega((0,0)) = \\{0\\}$ because both walls meet. Zero is just one point; the entire quadrant is feasible!"
      },
      {
        id: 5,
        cardNumber: "05",
        highlighterClass: "highlight-amber",
        title: "First-Order Optimality: ∇f(x*)ᵀd ≥ 0",
        category: "OPTIMALITY THEOREM",
        drawingSvg: `
          <svg viewBox="0 0 240 145" class="w-full h-full">
            <defs>
              <marker id="arr-opt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

            <!-- Supporting hyperplane (dashed line) -->

            <!-- Negative gradient -∇f pointing into exterior -->
            <line x1="110" y1="85" x2="45" y2="50" stroke="#000000" stroke-width="2" marker-end="url(#arr-opt)"/>
            <text x="35" y="45" fill="#000000" font-size="9" font-family="serif" font-style="italic" font-weight="bold">-∇f(x*)</text>
            <!-- Vertex x* -->
            <circle cx="110" cy="85" r="4" fill="#000000"/>
            <text x="100" y="100" fill="#000000" font-size="9.5" font-family="serif" font-style="italic">x*</text>
            <text x="120" y="20" fill="#000000" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Optimality: ∇f(x*)ᵀd ≥ 0  (∀ d ∈ T_Ω)</text>
            <text x="120" y="138" fill="#000000" font-size="8.5" font-family="sans-serif" text-anchor="middle">-∇f(x*) makes obtuse angle (≥ 90°) with all feasible directions</text>

        coreTranslation: [
          "If $x^* \\in \\Omega$ is a local minimizer of $f$, then: $$\\nabla f(x^*)^T d \\ge 0, \\quad \\forall d \\in T_\\Omega(x^*)$$",
          "<strong>Geometric Meaning:</strong> Any movement into $\\Omega$ causes $f$ to increase or stay level. There are <strong>zero descent directions</strong> inside the tangent cone!",

        ],
        math: `$$\\nabla f(x^*)^T d \\ge 0, \\quad \\forall d \\in T_\\Omega(x^*)$$ $$\\text{Taylor: } f(x + t_k d) = f(x) + t_k \\nabla f(x)^T d + o(t_k)$$`,
        personalConnection: "A golf ball rolled into a corner against the curb: gravity pulls downward, but the curb blocks it. The only legal roll is back uphill ($\Delta f \\ge 0$).",

      },
      {
        id: 6,
        cardNumber: "06",
        highlighterClass: "highlight-cyan",
        title: "Tangent Cone vs Linearized Cone",
        category: "EXAM TRAPS & CQ",
        textbookImg: "assets/luenberger_fig12_1.png",
        textbookRef: "Luenberger & Ye (4th ed), Sect. 12.1, Fig. 12.1 (p. 360)",
        drawingCaption: "Luenberger Fig. 12.1: Nonlinear constraints require curved paths; straight tangents can exit Ω",
        coreTranslation: [
          "<strong>Tangent Cone $T_\\Omega(x)$</strong> is built from actual physical paths inside $\\Omega$.",
          "<strong>Linearized Cone $L_\\Omega(x)$</strong> replaces curves with first-order gradient approximations: $\\nabla h_i(x)^T d = 0, \\; \\nabla g_j(x)^T d \\le 0 \\, (j \\in \\mathcal{A}(x))$.",
          "Always: $T_\\Omega(x) \\subseteq L_\\Omega(x)$. But equality holds only under <strong>Constraint Qualifications</strong> (like LICQ or Mangasarian-Fromovitz)!"
        ],
        math: `$$L_\\Omega(x) = \\{ d : \\nabla h_i(x)^T d = 0, \\; \\nabla g_j(x)^T d \\le 0 \\, (j \\in \\mathcal{A}(x)) \\}$$ $$T_\\Omega(x) = L_\\Omega(x) \\iff \\text{Constraint Qualification (CQ) holds}$$`,
        personalConnection: "A blueprint map showing a flat bridge because of linear drawing errors, but when you arrive in person, there is a cliff. $T_\\Omega$ is the real physical cliff; $L_\\Omega$ is the faulty linear blueprint.",

    const masterCards = window.MASTER_CARDS_DATA || defaultDeck;
    const SUBJECTS = [
      { id: 'CMO', color: '#5cc8f5' },
      { id: 'LAA', color: '#b79cf5' },
      { id: 'StoMA', color: '#f2b84b' },
      { id: 'DIP', color: '#5fd3a0' }
    ];
    const RATINGS_KEY = 'plates_ratings_v1';
    const POS_KEY = 'plates_pos_v1';

    let ratings = {};
    try { ratings = JSON.parse(localStorage.getItem(RATINGS_KEY) || '{}'); } catch (e) { ratings = {}; }
    function saveRatings() { try { localStorage.setItem(RATINGS_KEY, JSON.stringify(ratings)); } catch (e) {} }
    function savePos() { try { localStorage.setItem(POS_KEY, JSON.stringify({ s: currentSubject, t: currentTopic, i: idx })); } catch (e) {} }

    let currentSubject = 'CMO';
    let currentTopic = null;
    let deck = [];
    let idx = 0;
    let mode = 'study';
    let revealed = false;

    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const stripTags = s => String(s || '').replace(/<\/?[^>]+(>|$)/g, '').replace(/\$/g, '');
    const topicOf = c => c.topicId || 'default';

    function getSubjectCards(sub) { return masterCards.filter(c => (c.subject || 'CMO') === sub); }

    function getTopicsList(sub) {
      const map = new Map();
      getSubjectCards(sub || currentSubject).forEach(c => {
        const id = topicOf(c);
        if (!map.has(id)) map.set(id, { id, title: c.topicTitle || 'Default deck', cards: [] });
        map.get(id).cards.push(c);
      });
      return Array.from(map.values());
    }

    const gotCount = cards => cards.filter(c => ratings[c.id] === 3).length;

    /* ---------- navigation ---------- */
    function applyAccent() {
      const s = SUBJECTS.find(x => x.id === currentSubject);
      document.documentElement.style.setProperty('--accent', s ? s.color : '#5cc8f5');
    }

    function switchSubject(sub) {
      currentSubject = sub;
      applyAccent();
      const topics = getTopicsList(sub);
      if (topics.length) {
        const firstOpen = topics.find(t => gotCount(t.cards) < t.cards.length) || topics[0];
        switchTopic(firstOpen.id);
      } else {
        currentTopic = null; deck = []; idx = 0;
        renderAll();
      }
      toggleRail(false);
    }

    function switchTopic(topicId, keepIdx) {
      currentTopic = topicId;
      deck = getSubjectCards(currentSubject).filter(c => topicOf(c) === topicId);
      if (!keepIdx) {
        const firstOpen = deck.findIndex(c => ratings[c.id] !== 3);
        idx = firstOpen === -1 ? 0 : firstOpen;
      }
      revealed = false;
      closeSearch();
      renderAll();
      toggleRail(false);
    }

    function goTo(i) {
      if (!deck.length) return;
      idx = Math.max(0, Math.min(deck.length - 1, i));
      revealed = false;
      renderAll();
    }

    function step(dir) {
      if (!deck.length) return;
      const n = idx + dir;
      if (n >= 0 && n < deck.length) { goTo(n); return; }
      const topics = getTopicsList();
      let t = topics.findIndex(x => x.id === currentTopic);
      t = (t + dir + topics.length) % topics.length;
      switchTopic(topics[t].id);
      if (dir < 0) goTo(deck.length - 1);
    }

    function setMode(m) {
      mode = m;
      revealed = false;
      renderAll();
    }

    function rate(n) {
      const card = deck[idx];
      if (!card) return;
      if (mode === 'traps' || (mode === 'recall' && !revealed)) return;
      ratings[card.id] = n;
      saveRatings();
      step(1);
    }

    function flip() {
      if (mode === 'recall' && !revealed) { revealed = true; renderAll(); }
      else if (mode === 'recall') { revealed = false; renderAll(); }
      else step(1);
    }

    function toggleRail(open) {
      document.getElementById('rail').classList.toggle('open', open);
      document.getElementById('scrim').classList.toggle('open', open);
    }

    /* ---------- rendering ---------- */
    function renderRail() {
      document.getElementById('subject-list').innerHTML = SUBJECTS.map(s => {
        const n = getSubjectCards(s.id).length;
        return `<button class="subj ${s.id === currentSubject ? 'active' : ''}" onclick="switchSubject('${s.id}')">
          <span class="dot" style="background:${s.color}"></span><span>${s.id}</span><span class="n">${n || ''}</span></button>`;
      }).join('');

      document.getElementById('topics-label').textContent = `${currentSubject} TOPICS`;
      const topics = getTopicsList();
      document.getElementById('topic-list').innerHTML = topics.length ? topics.map(t => {
        const got = gotCount(t.cards);
        const done = got === t.cards.length;
        const ring = done
          ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5fd3a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>`
          : `<span class="ring"></span>`;
        return `<button class="topic ${t.id === currentTopic ? 'active' : ''}" onclick="switchTopic('${t.id}')" title="${esc(t.title)}">
          ${ring}<span class="name">${esc(t.title)}</span><span class="cnt">${got}/${t.cards.length}</span></button>`;
      }).join('') : `<div style="padding:8px 10px;font-size:13px;color:#8e9bb8;line-height:1.5">No cards for ${currentSubject} yet.</div>`;

      const all = getSubjectCards(currentSubject);
      const got = gotCount(all);
      const pct = all.length ? Math.round(got / all.length * 100) : 0;
      document.getElementById('progress-card').innerHTML = `
        <div style="display:flex;justify-content:space-between"><span>${currentSubject} progress</span><span class="mono" style="color:#e6ebf5">${got} / ${all.length}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div style="font-size:12px;color:#8e9bb8;line-height:1.5">${all.length - got ? `${all.length - got} cards still to master. Rate a card “Got it” to count it.` : (all.length ? 'Every card mastered.' : '')}</div>`;
    }

    function renderTop() {
      const t = getTopicsList().find(x => x.id === currentTopic);
      const card = deck[idx];
      document.getElementById('crumb').innerHTML = `<span>${currentSubject}</span><span aria-hidden="true">/</span>
        <span class="t">${t ? esc(t.title) : '—'}</span>${card ? `<span aria-hidden="true">/</span><b>Card ${esc(card.cardNumber)}</b>` : ''}`;
      ['study', 'recall', 'traps'].forEach(m => {
        document.getElementById('mode-' + m).setAttribute('aria-selected', String(m === mode));
      });
      document.title = card ? `${card.title} · Plates` : 'Plates · Photographic Memory Cards';
    }

    function renderStrip() {
      const strip = document.getElementById('card-strip');
      if (!deck.length) { strip.innerHTML = ''; return; }
      strip.innerHTML = deck.map((c, i) => {
        const r = ratings[c.id];
        return `<button class="chipbtn ${r ? 'r' + r : ''} ${i === idx ? 'cur' : ''}" onclick="goTo(${i})" aria-label="Card ${esc(c.cardNumber)}${i === idx ? ', current' : ''}">${esc(c.cardNumber)}</button>`;
      }).join('') + `<span class="hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> rate · <kbd>Space</kbd> ${mode === 'recall' ? 'reveal' : 'next'} · <kbd>/</kbd> search</span>`;
    }

    function plateHtml(card) {
      return card.textbookImg
        ? `<img src="${esc(card.textbookImg)}" alt="${esc(card.title)}" class="plate-img" onclick="openLightboxById(${card.id})">`
        : `<div class="plate-svg">${card.drawingSvg || ''}</div>`;
    }

    function cardHtml(card) {
      const leads = ['What', 'How', 'Why'];
      const mech = card.coreTranslation.map((pt, i) =>
        `<li><span class="lead">${card.coreTranslation.length === 3 ? leads[i] : '›'}</span><span>${pt}</span></li>`).join('');
      return `
        <article class="card" aria-label="Card ${esc(card.cardNumber)}: ${esc(card.title)}">
          <div class="card-left">
            <div>
              <div class="card-head"><span class="chip">CARD ${esc(card.cardNumber)}</span><span class="cat">${esc(card.category)}</span></div>
              <h1 class="card-title">${card.title}</h1>
            </div>
            <section><div class="sec-label">1 · CORE MECHANISM</div><ul class="mech">${mech}</ul></section>
            <section><div class="sec-label">2 · FORMAL MATHEMATICS</div><div class="math-block">${card.math}</div></section>
            <div class="duo">
              <section class="anchor"><div class="sec-label">3 · MEMORY ANCHOR</div><p>${card.personalConnection}</p></section>
              <section class="trap"><div class="sec-label">4 · EXAM TRAP</div><p>${card.examTrap}</p></section>
            </div>
          </div>
          <aside class="card-right">
            <div class="plate-head">
              <span class="sec-label muted">5 · VISUAL PLATE</span>
              <button class="copy-btn" id="copy-btn-${card.id}" onclick="copyCard(${card.id})" title="Copy card text, math and image to the clipboard">
                <span id="copy-icon-${card.id}">⧉</span><span id="copy-text-${card.id}">Copy</span></button>
            </div>
            <figure class="plate-fig">
              <div class="plate">${plateHtml(card)}</div>
              <figcaption><span class="sec-label muted">6 · CAPTION&nbsp;&nbsp;</span>${card.drawingCaption || ''}
                ${card.textbookImg ? `<button class="expand" onclick="openLightboxById(${card.id})">Expand</button>` : ''}</figcaption>
            </figure>
          </aside>
        </article>`;
    }

    function recallHtml(card) {
      const slot = (k, name, lines, cls) => `<div class="slot ${cls || ''}"><span class="k">${k}</span><div class="ln">${lines.map(w => `<i style="width:${w}%"></i>`).join('')}</div><span class="nm">${name}</span></div>`;
      return `
        <div class="recall">
          <section>
            <div><div class="sec-label">STEP 1 · LOOK AT THE PLATE</div>
              <h1>What concept is this, and what is the formula?</h1></div>
            <div class="plate">${plateHtml(card)}</div>
            <p style="margin:0;font-size:14px;line-height:1.5;color:#9aa6c0">Say the idea out loud before you reveal anything. The picture should rebuild the formula for you.</p>
          </section>
          <section>
            <div class="sec-label" style="color:#b4bfd6">STEP 2 · REBUILD THE CARD</div>
            ${slot('T', 'Concept title', [62])}
            ${slot('1', 'What · How · Why', [84, 70, 52])}
            ${slot('2', 'Formula', [66])}
            ${slot('3', 'Memory anchor', [58])}
            ${slot('4', 'Exam trap', [44], 'trap-slot')}
            <button class="reveal" onclick="flip()">Reveal card <kbd>Space</kbd></button>
          </section>
        </div>`;
    }

    function trapsHtml() {
      const t = getTopicsList().find(x => x.id === currentTopic);
      return `<div class="traps"><div class="sec-label">EXAM TRAPS</div><h1>${t ? esc(t.title) : ''}</h1>` +
        deck.map((c, i) => `<button class="trap-row" onclick="mode='study';goTo(${i})">
          <span class="n">${esc(c.cardNumber)}</span><span><div class="tt">${c.title}</div><div class="tx">${c.examTrap}</div></span></button>`).join('') + `</div>`;
    }

    function renderStage() {
      const stage = document.getElementById('stage');
      if (!deck.length) {
        stage.innerHTML = `<div class="empty"><h2>No cards for ${currentSubject} yet</h2>
          <p>Cards you generate for this subject will show up here, grouped by topic.</p></div>`;
      } else if (mode === 'traps') {
        stage.innerHTML = trapsHtml();
      } else if (mode === 'recall' && !revealed) {
        stage.innerHTML = recallHtml(deck[idx]);
      } else {
        stage.innerHTML = cardHtml(deck[idx]);
      }
      typesetMath(stage);
    }

    function renderActions() {
      const bar = document.getElementById('actions');
      if (!deck.length || mode === 'traps') { bar.innerHTML = ''; return; }
      const canRate = !(mode === 'recall' && !revealed);
      bar.innerHTML = `
        <button class="nav" onclick="step(-1)">← Previous</button>
        <div class="sp"></div>
        <span class="q">${canRate ? 'How well did you know it?' : 'Reveal the card, then rate yourself'}</span>
        <button class="rate again" onclick="rate(1)" ${canRate ? '' : 'disabled'}>Again<kbd>1</kbd></button>
        <button class="rate" onclick="rate(2)" ${canRate ? '' : 'disabled'}>Shaky<kbd>2</kbd></button>
        <button class="rate good" onclick="rate(3)" ${canRate ? '' : 'disabled'}>Got it<kbd>3</kbd></button>
        <button class="nav next" onclick="step(1)">Next →</button>`;
    }

    function typesetMath(root) {
      const run = () => window.renderMathInElement && renderMathInElement(root, {
        delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
        throwOnError: false
      });
      if (window.renderMathInElement) run(); else window.addEventListener('load', run, { once: true });
    }

    function renderAll() {
      renderRail(); renderTop(); renderStrip(); renderStage(); renderActions();
      savePos();
    }
    function renderDeck() { idx = Math.max(0, Math.min(idx, deck.length - 1)); renderAll(); }

    /* ---------- search across every subject ---------- */
    function closeSearch() {
      const r = document.getElementById('search-results');
      if (r) r.hidden = true;
    }

    function runSearch() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const box = document.getElementById('search-results');
      if (!q) { box.hidden = true; return; }
      const hits = masterCards.map(c => {
        const fields = [c.title, c.category, c.topicTitle, c.personalConnection, c.examTrap, ...(c.coreTranslation || [])].map(stripTags);
        const hay = fields.join(' ').toLowerCase();
        return hay.includes(q) ? { c, trap: stripTags(c.examTrap).toLowerCase().includes(q) } : null;
      }).filter(Boolean).slice(0, 8);
      box.innerHTML = hits.length ? hits.map(h => `
        <button class="res" onclick="openCard(${h.c.id})">
          <span>${stripTags(h.c.title)}</span>
          <span class="meta">${esc(h.c.subject || 'CMO')} · ${esc(h.c.topicTitle || 'Default deck')} · Card ${esc(h.c.cardNumber)}</span>
          <span class="snip">${h.trap ? 'Exam trap: ' + esc(stripTags(h.c.examTrap).slice(0, 110)) : esc(stripTags((h.c.coreTranslation || [])[0]).slice(0, 110))}</span>
        </button>`).join('') : `<div class="res-empty">No cards match “${esc(q)}”.</div>`;
      box.hidden = false;
    }

    function openCard(id) {
      const c = masterCards.find(x => x.id === id);
      if (!c) return;
      currentSubject = c.subject || 'CMO';
      applyAccent();
      mode = 'study';
      switchTopic(topicOf(c), true);
      idx = Math.max(0, deck.findIndex(x => x.id === id));
      document.getElementById('search-input').value = '';
      renderAll();
    }

    /* ---------- print: the whole topic, one card per page ---------- */
    function printDeck() {
      if (!deck.length) return;
      const stage = document.getElementById('stage');
      stage.innerHTML = deck.map(cardHtml).join('');
      typesetMath(stage);
      const restore = () => { renderStage(); window.removeEventListener('afterprint', restore); };
      window.addEventListener('afterprint', restore);
      setTimeout(() => window.print(), 150);
    }

    function openLightboxById(id) {
      const c = masterCards.find(x => x.id === id) || deck.find(x => x.id === id);
      if (c && c.textbookImg) openLightbox(c.textbookImg, stripTags(c.title), c.textbookRef || '');
    }

    /* ---------- keyboard ---------- */
    document.addEventListener('keydown', e => {
      const input = document.getElementById('search-input');
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); input.focus(); input.select(); return; }
      if (e.key === 'Escape') { closeSearch(); closeLightbox(); closeAddModal(); toggleRail(false); input.blur(); return; }
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/') { e.preventDefault(); input.focus(); }
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === ' ' && !(t && t.tagName === 'BUTTON')) { e.preventDefault(); flip(); }
      else if (e.key === '1' || e.key === '2' || e.key === '3') rate(Number(e.key));
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search')) closeSearch();
    });

    /* ---------- boot ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      let pos = null;
      try { pos = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch (e) {}
      if (pos && SUBJECTS.some(s => s.id === pos.s) && getTopicsList(pos.s).some(t => t.id === pos.t)) {
        currentSubject = pos.s;
        applyAccent();
        switchTopic(pos.t, true);
        idx = Math.max(0, Math.min(pos.i || 0, deck.length - 1));
        renderAll();
      } else {
        switchSubject('CMO');
      }
    });

    /* Lightbox Modal */
    function openLightbox(src, title, ref) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').textContent = title;
      document.getElementById('lightbox-ref').textContent = ref;
      document.getElementById('lightbox-modal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
    }

    /* Add Card Modal */
    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function saveCustomCard(e) {
      e.preventDefault();
      const title = document.getElementById('new-title').value;
      const info = document.getElementById('new-info').value;
      const math = document.getElementById('new-math').value;
      const conn = document.getElementById('new-connection').value;
      const caption = document.getElementById('new-drawing-caption').value;

      const newId = deck.length + 1;
      const numStr = String(newId).padStart(2, '0');

      const newCard = {
        id: newId,
        cardNumber: numStr,
        highlighterClass: "highlight-cyan",
        title: title,
        category: "CUSTOM SPECIMEN",
        drawingSvg: `
          <svg viewBox="0 0 240 145" class="w-full h-full">
            <rect x="25" y="25" width="190" height="95" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
            <circle cx="120" cy="72" r="14" fill="#38bdf8" fill-opacity="0.3"/>
            <text x="120" y="77" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">✨</text>
          </svg>
        `,
        drawingCaption: caption,
        coreTranslation: [info],
        math: math ? `$$${math}$$` : `$$\\text{Formalization pending}$$`,
        personalConnection: conn,
        examTrap: "Check all active constraint boundary conditions!"
      };

      deck.push(newCard);
      idx = deck.length - 1;
      localStorage.setItem('sirianni_index_cards_cosmos_v7', JSON.stringify(deck));
      closeAddModal();
      renderDeck();
    }

    /* ================= CLIPBOARD COPY UTILITIES ================= */
    function getBase64FromImageUrl(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          } catch (e) {
            resolve(new URL(url, window.location.href).href);
          }
        };
        img.onerror = () => resolve(new URL(url, window.location.href).href);
        img.src = url;
      });
    }

    function getSvgAsPngDataUrl(svgString, width = 600, height = 360) {
      return new Promise((resolve) => {
        try {
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const URL = window.URL || window.webkitURL || window;
          const blobURL = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            URL.revokeObjectURL(blobURL);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = () => {
            resolve("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString));
          };
          img.src = blobURL;
        } catch (e) {
          resolve("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString));
        }
      });
    }

    async function copyCard(cardId) {
      const card = deck.find(c => c.id === cardId);
      if (!card) return;

      const btn = document.getElementById(`copy-btn-${cardId}`);
      const iconEl = document.getElementById(`copy-icon-${cardId}`);
      const textEl = document.getElementById(`copy-text-${cardId}`);

      if (textEl) textEl.textContent = "Copying...";

      try {
        // 1. Plain Text / Markdown Format
        let md = `# CARD ${card.cardNumber}: ${card.title}\n`;
        md += `Category: ${card.category}\n\n`;
        md += `## ⚡ Core Mechanism\n`;
        card.coreTranslation.forEach(pt => {
          const cleanPt = pt.replace(/<\/?[^>]+(>|$)/g, "");
          md += `• ${cleanPt}\n`;
        });
        md += `\n## 📐 Mathematical Formulation\n${card.math}\n\n`;
        md += `## 💡 Memory Anchor\n"${card.personalConnection}"\n\n`;
        md += `## ⚠️ Exam Trap\n${card.examTrap}\n\n`;

        let fullImgUrl = "";
        let visualDataUrl = "";

        if (card.textbookImg) {
          fullImgUrl = new URL(card.textbookImg, window.location.href).href;
          md += `## 📖 Visual Specimen (${card.textbookRef || 'Luenberger & Ye'})\n`;
          md += `Caption: "${card.drawingCaption}"\n`;
          md += `Image: ${fullImgUrl}\n`;
          visualDataUrl = await getBase64FromImageUrl(card.textbookImg);
        } else if (card.drawingSvg) {
          md += `## 📐 Geometric Diagram\n`;
          md += `Caption: "${card.drawingCaption}"\n`;
          visualDataUrl = await getSvgAsPngDataUrl(card.drawingSvg);
        }

        // 2. Rich Formatted HTML
        let visualHtml = "";
        if (visualDataUrl) {
          visualHtml = `
            <div style="margin-top: 18px; text-align: center; background: #ffffff; padding: 14px; border-radius: 12px; border: 1px solid #cbd5e1;">
              <p style="font-size: 11px; font-family: monospace; color: #475569; margin: 0 0 8px 0; font-weight: bold; text-transform: uppercase;">
                ${card.textbookRef ? `📖 ${card.textbookRef}` : '📐 GEOMETRIC SPECIMEN'}
              </p>
              <img src="${visualDataUrl}" alt="${card.title}" style="max-width: 100%; max-height: 440px; display: block; margin: 0 auto; object-fit: contain;" />
              <p style="font-size: 13px; font-style: italic; color: #334155; margin: 10px 0 0 0; font-weight: 500;">"${card.drawingCaption}"</p>
            </div>
          `;
        }

        const html = `
          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 720px; padding: 24px; background: #0c101d; color: #f1f5f9; border-radius: 16px; border: 1px solid #38bdf8;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 12px; margin-bottom: 16px;">
              <span style="font-family: monospace; font-weight: bold; background: #083344; color: #67e8f9; padding: 4px 10px; border-radius: 6px; font-size: 12px; border: 1px solid #0e7490;">
                CARD ${card.cardNumber} • ${card.category}
              </span>
              <h2 style="margin: 0; font-size: 22px; color: #ffffff; font-weight: bold;">${card.title}</h2>
            </div>

            <div style="margin-bottom: 16px;">
              <h4 style="font-size: 12px; font-family: monospace; color: #38bdf8; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 1px;">
                ⚡ CORE MECHANISM
              </h4>
              <ul style="margin: 0; padding-left: 20px; line-height: 1.6; font-size: 15px; color: #e2e8f0;">
                ${card.coreTranslation.map(pt => `<li style="margin-bottom: 8px;">${pt}</li>`).join('')}
              </ul>
            </div>

            <div style="background: #060812; padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(56,189,248,0.25); font-family: monospace; font-size: 15px; margin-bottom: 16px; color: #f8fafc; overflow-x: auto;">
              ${card.math}
            </div>

            <div style="background: rgba(245,158,11,0.12); border-left: 4px solid #fbbf24; padding: 14px 18px; border-radius: 8px; margin-bottom: 16px;">
              <div style="font-size: 11px; font-weight: bold; color: #fbbf24; text-transform: uppercase; margin-bottom: 4px;">
                💡 MEMORY ANCHOR
              </div>
              <p style="margin: 0; font-style: italic; font-size: 15px; color: #fef3c7; line-height: 1.5;">
                "${card.personalConnection}"
              </p>
            </div>

            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; font-size: 13px; color: #fca5a5;">
              <strong style="color: #f87171;">⚠️ Exam Trap:</strong> ${card.examTrap}
            </div>

            ${visualHtml}
          </div>
        `;

        // 3. Write to Clipboard using modern ClipboardItem API
        if (navigator.clipboard && window.ClipboardItem) {
          const textBlob = new Blob([md], { type: 'text/plain' });
          const htmlBlob = new Blob([html], { type: 'text/html' });
          const item = new ClipboardItem({
            'text/plain': textBlob,
            'text/html': htmlBlob
          });
          await navigator.clipboard.write([item]);
        } else {
          await navigator.clipboard.writeText(md);
        }

        // Button feedback
        if (iconEl) iconEl.textContent = "✓";
        if (textEl) textEl.textContent = "Copied!";
        if (btn) {
          btn.classList.add('bg-emerald-500', 'text-slate-950', 'border-emerald-400', 'font-bold');
          btn.classList.remove('bg-[#0d1326]/90', 'text-cyan-300');
        }

        setTimeout(() => {
          if (iconEl) iconEl.textContent = "⧉";
          if (textEl) textEl.textContent = "Copy";
          if (btn) {
            btn.classList.remove('bg-emerald-500', 'text-slate-950', 'border-emerald-400', 'font-bold');
            btn.classList.add('bg-[#0d1326]/90', 'text-cyan-300');
          }
        }, 2000);

        showToast(`✓ Card ${card.cardNumber} copied with text, math & images!`);

      } catch (err) {
        console.error("Copy error:", err);
        // Fallback plain copy
        try {
          const plainFallback = `CARD ${card.cardNumber}: ${card.title}\n\n` +
            card.coreTranslation.map(p => `• ${p.replace(/<\/?[^>]+(>|$)/g, "")}`).join('\n') +
            `\n\nMath:\n${card.math}\n\nMemory Anchor:\n"${card.personalConnection}"\n\nExam Trap:\n${card.examTrap}`;
          await navigator.clipboard.writeText(plainFallback);
          if (textEl) textEl.textContent = "Copied Text!";
          showToast(`✓ Card ${card.cardNumber} text copied!`);
          setTimeout(() => { if (textEl) textEl.textContent = "Copy"; }, 2000);
        } catch (e) {
          alert("Clipboard access denied. Please allow clipboard permissions.");
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }


  </script>

  <!-- Toast Notification for Copy -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-[#0c101d] border border-cyan-400/60 text-cyan-200 px-5 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-mono flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <span class="text-cyan-400 text-base">✦</span>
    <span id="toast-msg">Card copied to clipboard!</span>
  </div>
</body>
